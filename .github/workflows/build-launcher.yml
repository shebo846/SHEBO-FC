name: Build SHEBO FC Launcher
on:
  workflow_dispatch:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher.yml"
    branches: [main]
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: launcher/package.json
      - name: Install dependencies
        run: npm install
      - name: Build launcher installer
        run: npm run dist
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SHEBO-FC-Launcher-Windows
          path: launcher/dist/*.exe
          if-no-files-found: error
