name: Build SHEBO FC Setup
on:
  workflow_dispatch:
  push:
    paths:
      - "installer/**"
      - ".github/workflows/build-setup.yml"
    branches: [main]

jobs:
  build-setup:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download game release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path game | Out-Null
          Invoke-WebRequest -Uri "https://github.com/shebo846/SHEBO-FC/releases/download/v4.1.7/SHEBO-FC-Windows.zip" -OutFile "game.zip"
          if ((Get-Item "game.zip").Length -lt 100000000) { throw "Downloaded game archive is too small." }
          Expand-Archive -Path "game.zip" -DestinationPath "game" -Force
          $asar = Get-ChildItem "game" -Filter "app.asar" -File -Recurse | Select-Object -First 1
          if (-not $asar) { throw "The release ZIP does not contain resources/app.asar." }
          $resourcesDir = $asar.Directory.FullName
          $gameDir = Split-Path $resourcesDir -Parent
          Write-Host "Detected game folder: $gameDir"
          New-Item -ItemType Directory -Force -Path "game/win-unpacked" | Out-Null
          Copy-Item -Path "$gameDir/*" -Destination "game/win-unpacked" -Recurse -Force
          $mainExe = Get-ChildItem "game/win-unpacked" -Filter "*.exe" -File | Where-Object { $_.Name -like "SHEBO FC*" } | Select-Object -First 1
          if (-not $mainExe) { throw "SHEBO FC main executable was not found in detected game folder." }
          if ($mainExe.Name -ne "SHEBO FC.exe") { Copy-Item $mainExe.FullName "game/win-unpacked/SHEBO FC.exe" -Force }
          if (-not (Test-Path "game/win-unpacked/resources/app.asar")) { throw "Game normalization failed: resources/app.asar is missing." }
          Write-Host "Ready to package: SHEBO FC.exe"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build standard Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/output | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer/SHEBO-FC.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Upload setup
        uses: actions/upload-artifact@v4
        with:
          name: SHEBO-FC-Setup-Windows
          path: installer/output/SHEBO-FC-Setup-4.1.7.exe
          if-no-files-found: error
